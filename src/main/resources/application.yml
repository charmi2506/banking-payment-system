spring:
  application:
    name: banking-payment-system
  cache:
    type: redis

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banking_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: banking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.banking.payment.*"

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  cache:
    default-ttl-seconds: ${CACHE_TTL_SECONDS:300}
    accounts-ttl-seconds: ${ACCOUNTS_CACHE_TTL_SECONDS:300}
    user-accounts-ttl-seconds: ${USER_ACCOUNTS_CACHE_TTL_SECONDS:300}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-login:
      limit: ${RATE_LIMIT_AUTH_LOGIN_MAX:5}
      window-seconds: ${RATE_LIMIT_AUTH_LOGIN_WINDOW:60}
    transfer:
      limit: ${RATE_LIMIT_TRANSFER_MAX:10}
      window-seconds: ${RATE_LIMIT_TRANSFER_WINDOW:60}
    deposit:
      limit: ${RATE_LIMIT_DEPOSIT_MAX:20}
      window-seconds: ${RATE_LIMIT_DEPOSIT_WINDOW:60}
    withdraw:
      limit: ${RATE_LIMIT_WITHDRAW_MAX:10}
      window-seconds: ${RATE_LIMIT_WITHDRAW_WINDOW:60}
  kafka:
    topics:
      transaction-events: banking.transaction.events
      audit-logs: banking.audit.logs
      notifications: banking.notifications

logging:
  level:
    root: INFO
    com.banking.payment: DEBUG
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

